name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --log-level WARN --onefile --windowed --name MergeExcel --specpath build app.py

      - uses: actions/upload-artifact@v4
        with:
          name: MergeExcel
          path: dist/MergeExcel.exe
