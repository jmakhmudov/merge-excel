[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merge-excel"
version = "1.0.0"
description = "Desktop app that merges Excel reports with different layouts into one clean table."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "PySide6-Essentials>=6.6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
]

[project.gui-scripts]
merge-excel = "merge_excel.ui:run"

[tool.setuptools]
packages = ["merge_excel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
